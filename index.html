    /* ── BLOG ── */

    /* Article modal */
    .article-modal-backdrop { position: fixed; inset: 0; background: rgba(10,22,40,0.7); z-index: 500; display: flex; align-items: flex-start; justify-content: center; padding: 60px 5% 40px; overflow-y: auto; backdrop-filter: blur(6px); animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    @keyframes slideUp { from { transform: translateY(20px); opacity:0; } to { transform: none; opacity:1; } }
    .article-close { position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: 50%; background: var(--surface2); border: none; cursor: pointer; font-size: 18px; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: background 0.2s; }

    /* ── POPUP ── */
    .popup-backdrop { position: fixed; inset: 0; background: rgba(10,22,40,0.6); z-index: 800; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); animation: fadeIn 0.3s ease; }
    .popup-box { background: var(--surface); border-radius: 24px; max-width: 480px; width: 100%; overflow: hidden; box-shadow: var(--shadow-xl); animation: slideUp 0.35s ease; position: relative; }
    .popup-header { background: var(--blue); padding: 36px 36px 28px; text-align: center; }

    .popup-header p { color: rgba(255,255,255,0.8); font-size: 15px; }

    /* ── COOKIES ── */

    @keyframes pulse { 0% { transform:scale(1);opacity:1; } 100% { transform:scale(1.6);opacity:0; } }

    /* Toast */
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; font-size: 14px; font-weight: 500; padding: 14px 28px; border-radius: 9px; z-index: 999; animation: toastIn 0.3s ease; box-shadow: var(--shadow-lg); }
    @keyframes toastIn { from { opacity:0;transform:translate(-50%,12px); } to { opacity:1;transform:translate(-50%,0); } }

    /* Hero fadein */
    @keyframes fadeUp { from { opacity:0;transform:translateY(18px); } to { opacity:1;transform:none; } }
    .hero-left > * { opacity:1; animation: fadeUp 0.6s ease forwards; }
    .hero-left > *:nth-child(1) { animation-delay:0.05s; }
    .hero-left > *:nth-child(2) { animation-delay:0.15s; }
    .hero-left > *:nth-child(3) { animation-delay:0.25s; }
    .hero-left > *:nth-child(4) { animation-delay:0.35s; }
    .hero-left > *:nth-child(5) { animation-delay:0.45s; }

    @media (max-width: 560px) { .steps-grid { grid-template-columns: 1fr; } }
    .step-card { position: relative; background: none; border: none; border-top: 2px solid var(--border); border-radius: 0; padding: 28px 20px 0 0; transition: border-color 0.25s; }
